name: OSDI Verification (Native x86_64)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/osdi-verification.yml'

jobs:
  verify-osdi:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "spice2va/requirements.txt" ]; then
            pip install -r spice2va/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "No dependency file found. Installing minimal dependencies explicitly."
            pip install groq pydantic google-genai
          fi

      - name: Print environment information
        run: |
          echo "=== OS Information ==="
          cat /etc/os-release
          echo "=== Architecture ==="
          uname -m
          echo "=== GCC Version ==="
          gcc --version
          echo "=== System Resources ==="
          echo "CPU Cores: $(nproc)"
          free -h

      - name: Verify Architecture
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" != "x86_64" ]; then
            echo "Error: Runner architecture is $ARCH, expected x86_64"
            exit 1
          fi
          echo "Architecture verified: x86_64"

      - name: Cache OSDI Infrastructure
        id: osdi-cache
        uses: actions/cache@v4
        with:
          path: |
            ngspice-install
            openvaf
          key: osdi-infra-v1-ubuntu-24.04-x86_64-ngspice-43-openvaf

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            libreadline-dev libncurses-dev

      - name: Install build dependencies
        if: steps.osdi-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -y --no-install-recommends install \
            build-essential bison flex autoconf libtool automake wget tar

      - name: Build and install OSDI Infrastructure
        if: steps.osdi-cache.outputs.cache-hit != 'true'
        run: |
          echo "OSDI infrastructure cache MISS - building ngspice"
          
          # 1. Build ngspice
          git clone --depth 1 --branch ngspice-43 https://git.code.sf.net/p/ngspice/ngspice
          cd ngspice
          ./autogen.sh
          ./configure --prefix=$GITHUB_WORKSPACE/ngspice-install --with-x=no --enable-osdi
          make -j$(nproc)
          make install
          cd ..
          
          # 2. Install OpenVAF
          wget --no-verbose https://openva.fra1.digitaloceanspaces.com/openvaf_devel-x86_64-unknown-linux-gnu.tar.gz -O openvaf.tar.gz
          tar -xzf openvaf.tar.gz
          chmod +x openvaf

      - name: Verify OSDI Infrastructure
        run: |
          if [ "${{ steps.osdi-cache.outputs.cache-hit }}" == "true" ]; then
            echo "OSDI infrastructure cache HIT - skipping ngspice build"
          fi
          
          echo "Verifying OpenVAF..."
          chmod +x openvaf
          ./openvaf --version
          
          echo "Verifying ngspice OSDI support..."
          $GITHUB_WORKSPACE/ngspice-install/bin/ngspice -v
          
          echo "Running functional OSDI verification test..."
          mkdir -p osdi_verify_tmp && cd osdi_verify_tmp
          cat << 'VERILOG' > simple_resistor.va
          `include "disciplines.vams"
          `include "constants.vams"
          module simple_resistor(p, n);
            inout p, n;
            electrical p, n;
            parameter real r = 1000;
            analog begin
              V(p,n) <+ r * I(p,n);
            end
          endmodule
          VERILOG
          
          ../openvaf simple_resistor.va -o simple_resistor.osdi
          
          cat << 'CIR' > test.cir
          OSDI Verification Test
          V1 n1 0 DC 1V
          N1 n1 0 my_resistor
          .model my_resistor simple_resistor (r=1000)
          
          .control
          pre_osdi simple_resistor.osdi
          op
          print V(n1)
          quit
          .endc
          .end
          CIR
          
          $GITHUB_WORKSPACE/ngspice-install/bin/ngspice -b test.cir > sim.log 2>&1
          if grep -i -E "fatal error|no such command available" sim.log; then
            echo "OSDI verification failed:"
            cat sim.log
            exit 1
          fi
          echo "OSDI functional test passed:"
          cat sim.log
          cd ..

      - name: Run Spice2VA LLM Pipeline (E2E Numerical Verification)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: groq
          OPENVAF_PATH: ${{ github.workspace }}/openvaf
          NGSPICE_PATH: ${{ github.workspace }}/ngspice-install/bin/ngspice
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Error: GROQ_API_KEY is missing."
            exit 1
          fi
          echo "GROQ_API_KEY is securely configured."
          
          set -euo pipefail
          cd spice2va
          
          echo "### Spice2VA Pipeline Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          
          # Run python pipeline, piping stdout and stderr to tee so it shows in logs and summary
          python -m src.main examples/rc_lowpass.cir 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f "examples/output/rc_lowpass.va" ]; then
            echo "Error: examples/output/rc_lowpass.va was not generated."
            exit 1
          fi

